<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Lab — Learn Python with Interactive Labs</title>
  <meta name="description" content="A free interactive environment for learning Python from absolute basics through writing functions. Guided tutorials and hands-on labs that run entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">

  <!-- CodeMirror (code editor) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <!-- Pyodide (Python in the browser) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header id="topbar">
      <button id="nav-toggle" title="Toggle menu" aria-label="Toggle menu">☰</button>
      <div class="brand">
        <span class="brand-logo">🐍</span>
        <span class="brand-name">Python&nbsp;Lab</span>
      </div>
      <div id="py-status" class="py-status loading">
        <span class="dot"></span><span id="py-status-text">Loading Python…</span>
      </div>
      <div class="top-progress">
        <div class="top-progress-label"><span id="progress-count">0</span> / <span id="progress-total">0</span> complete</div>
        <div class="top-progress-track"><div id="progress-fill" class="top-progress-fill"></div></div>
      </div>
    </header>

    <!-- Sidebar navigation -->
    <nav id="sidebar">
      <div class="sidebar-intro">
        <p>Work through the modules in order. <strong>Tutorials</strong> teach, <strong>labs</strong> make you write real code — checked automatically, right in your browser.</p>
      </div>
      <div id="module-list"></div>
      <div class="sidebar-footer">
        <button id="reset-progress" class="linklike">Reset my progress</button>
      </div>
    </nav>
    <div id="sidebar-backdrop"></div>

    <!-- Main content -->
    <main id="main">
      <div id="lesson-container"></div>
      <div id="lesson-nav">
        <button id="prev-btn" class="btn ghost">← Previous</button>
        <button id="next-btn" class="btn primary">Next →</button>
      </div>
      <footer id="site-footer">
        <p>Python Lab · runs 100% in your browser with <a href="https://pyodide.org" target="_blank" rel="noopener">Pyodide</a> · no account, no server, your progress is saved on this device.</p>
      </footer>
    </main>
  </div>

  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
