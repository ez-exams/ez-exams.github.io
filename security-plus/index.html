<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#161826" />
  <title>CompTIA Security+ SY0-701 Study Hub · EZ Exam</title>
  <meta name="description" content="Security+ SY0-701 study hub — practice exams with instant feedback, a timed live-exam simulation with PBQs, flashcards, guided PBQ lessons, and ports &amp; protocols drills." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161826'/%3E%3Ctext x='32' y='42' font-family='Inter,Arial,sans-serif' font-weight='700' font-size='24' text-anchor='middle' fill='%239184d9'%3ESY%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../assets/nocturne-ds.css" />
  <script>
    (function () {
      var h = location.hostname;
      if (h !== "ez-exams.github.io" && h !== "localhost" && h !== "127.0.0.1") {
        document.documentElement.setAttribute("data-ez-standalone", "");
      }
    })();
  </script>
  <style>
    html, body { margin: 0; background: #161826; color: #e9e9ed; -webkit-text-size-adjust: 100%; }
    a { color: #9184d9; text-underline-offset: 3px; }
    a:hover { color: #b5abfc; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.55">
    <header class="hub-header">
      <a class="ez-nav-home" href="../">&#8962; Home</a>
      <button class="hub-title" type="button" data-a="goHome">
        <span class="hub-code">SY0-701</span>
        <span class="hub-name">Security+ Study Hub</span>
      </button>
      <span id="hdr-timer" class="hub-timer" hidden></span>
      <span id="hdr-progress" class="hub-progress" hidden></span>
      <button id="hdr-exit" class="btn btn-secondary" type="button" data-a="askEnd" hidden></button>
    </header>
    <main id="hub-main" class="hub-main"></main>
    <div id="hub-dialog"></div>
  </div>

  <script src="static/ports-data.js"></script>
  <script src="static/pbq-data.js"></script>
  <script src="static/pbq-test-data.js"></script>
  <script src="static/lessons-view.js"></script>
  <script src="../assets/hub-engine.js"></script>
  <script>
    /* PBQ items in the SY0-701 pack are tagged by skill, not by exam domain.
       Map each skill onto the domain it actually belongs to so the
       per-section breakdown stays honest. */
    var PBQ_DOMAIN = { controls: 1, network: 3, logs: 4 };

    /* Ports & Protocols quiz — built from the same 17-port deck the
       flashcards use, alternating both directions. */
    function portsQuiz(entries) {
      var items = [];
      entries.forEach(function (p, i) {
        var others = entries.filter(function (x) { return x.acronym !== p.acronym; });
        var pick = others.sort(function () { return Math.random() - 0.5; }).slice(0, 3);
        var askPort = i % 2 === 0;
        var right = askPort ? p.ports : p.acronym;
        var wrong = pick.map(function (x) { return askPort ? x.ports : x.acronym; });
        var all = [right].concat(wrong).sort(function () { return Math.random() - 0.5; });
        var opts = {}, correct = [];
        all.forEach(function (txt, j) {
          var k = "ABCD".charAt(j);
          opts[k] = txt;
          if (txt === right) correct.push(k);
        });
        items.push({
          id: "ports-" + p.acronym + "-" + i,
          domain: 3,
          question: askPort
            ? "Which port (or ports) does " + p.acronym + " — " + p.name + " — use?"
            : "Which protocol uses port " + p.ports + " over " + p.proto + "?",
          options: opts,
          correct: correct,
          explanation: p.acronym + " (" + p.name + ") uses " + p.ports + "/" + p.proto + ". " + p.description
        });
      });
      return items;
    }

    EZHub.init({
      eyebrow: "CompTIA Certified · Core",
      blurb: 'Every question is drawn from the SY0-701 pool and tagged to its exam domain, so your results tell you what to study next.',
      footer: "Question pool sourced from public community dumps. Independent study tool — not affiliated with or endorsed by CompTIA.",
      storageKey: "secplushub.exam.v1",
      sectionsHeading: "Exam domains",
      sections: [
        { n: 1, num: "1.0", name: "General Security Concepts", weight: "12%" },
        { n: 2, num: "2.0", name: "Threats, Vulnerabilities, and Mitigations", weight: "22%" },
        { n: 3, num: "3.0", name: "Security Architecture", weight: "18%" },
        { n: 4, num: "4.0", name: "Security Operations", weight: "28%" },
        { n: 5, num: "5.0", name: "Security Program Management and Oversight", weight: "20%" }
      ],
      exam: { minutes: 90, total: 80, pass: 83, weight: 3 },
      practice: { min: 10, max: 90, def: 50 },
      pbqBlurb: "The interactive tasks that open the real exam — firewall and control grids, drag-and-drop placement, and log triage, all graded with partial credit.",
      pbqCats: [
        ["all", "Mixed", "All PBQ styles"],
        ["network", "Network", "Firewall and topology grids"],
        ["controls", "Controls", "Place the right control"],
        ["logs", "Log analysis", "Spot the malicious lines"]
      ],
      pbqSizes: [[3, "3", "Quick check"], [5, "5", "Standard run"], [10, "10", "Deep drill"], [21, "All", "Every PBQ"]],
      loadPool: function () {
        return fetch("data/questions.json").then(function (r) { return r.json(); })
          .then(function (list) {
            return list.map(function (q) { q.domain = +q.domain || 1; return q; });
          });
      },
      loadPbqs: function () {
        return (window.PBQ_TEST || []).map(function (p) {
          p.domain = p.domain || PBQ_DOMAIN[p.category] || 4;
          return p;
        });
      },
      extras: [
        {
          id: "ports", kind: "deck",
          kicker: "Know the numbers", title: "Ports & Protocols",
          desc: "The 17 ports SY0-701 expects you to know cold — drill them as flashcards, or take a scored quiz in both directions.",
          cta: "Drill the ports →",
          setupBlurb: "The port numbers the exam keeps coming back to. Flashcards let you self-grade; the quiz asks in both directions and scores you.",
          load: function () {
            return (typeof PORTS === "undefined" ? [] : PORTS).map(function (p) {
              return {
                kicker: p.proto + " · port " + p.ports,
                front: p.acronym + " — " + p.name,
                backLabel: "Port " + p.ports + " / " + p.proto,
                back: p.ports + " (" + p.proto + ")",
                extra: p.description
              };
            });
          },
          quiz: function () { return portsQuiz(typeof PORTS === "undefined" ? [] : PORTS); }
        },
        {
          id: "lessons", kind: "lessons",
          kicker: "Learn the pattern", title: "PBQ Lessons",
          desc: "Fourteen guided walkthroughs covering how each PBQ style is scored and the repeatable way to attack it.",
          cta: "Open the lessons →",
          setupBlurb: "Short guided lessons on the PBQ styles the exam uses — read one before you drill, and the tasks stop feeling like guesswork.",
          list: function () { return window.EZLessons ? window.EZLessons.list() : []; },
          render: function (id) { return window.EZLessons ? window.EZLessons.render(id) : ""; }
        }
      ]
    });
  </script>
</body>
</html>
