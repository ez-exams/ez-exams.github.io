<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#161826" />
  <title>Microsoft Azure Fundamentals AZ-900 Study Hub · EZ Exam</title>
  <meta name="description" content="AZ-900 Azure Fundamentals study hub — practice exams with instant feedback, a timed live-exam simulation with PBQs, flashcards, and performance-based questions." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161826'/%3E%3Ctext x='32' y='42' font-family='Inter,Arial,sans-serif' font-weight='700' font-size='26' text-anchor='middle' fill='%239184d9'%3EAZ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../assets/nocturne-ds.css" />
  <script>
    (function () {
      var h = location.hostname;
      if (h !== "ez-exams.github.io" && h !== "localhost" && h !== "127.0.0.1") {
        document.documentElement.setAttribute("data-ez-standalone", "");
      }
    })();
  </script>
  <style>
    html, body { margin: 0; background: #161826; color: #e9e9ed; -webkit-text-size-adjust: 100%; }
    a { color: #9184d9; text-underline-offset: 3px; }
    a:hover { color: #b5abfc; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.55">
    <header class="hub-header">
      <a class="ez-nav-home" href="../">&#8962; Home</a>
      <button class="hub-title" type="button" data-a="goHome">
        <span class="hub-code">AZ-900</span>
        <span class="hub-name">Azure Fundamentals Study Hub</span>
      </button>
      <span id="hdr-timer" class="hub-timer" hidden></span>
      <span id="hdr-progress" class="hub-progress" hidden></span>
      <button id="hdr-exit" class="btn btn-secondary" type="button" data-a="askEnd" hidden></button>
    </header>
    <main id="hub-main" class="hub-main"></main>
    <div id="hub-dialog"></div>
  </div>

  <script src="static/pbq-data.js"></script>
  <script src="../assets/hub-engine.js"></script>
  <script>
    EZHub.init({
      eyebrow: "Microsoft Certified · Fundamentals",
      blurb: 'Every question is drawn from the AZ-900 pool and tagged to its <b style="color:var(--color-text);font-weight:500">Skills at a glance</b> section, so your results tell you what to study next.',
      footer: "Question pool sourced from public community dumps. Independent study tool — not affiliated with or endorsed by Microsoft.",
      storageKey: "az900hub.exam.v1",
      sections: [
        { n: 1, num: "§1", name: "Describe cloud concepts", weight: "25–30%" },
        { n: 2, num: "§2", name: "Describe Azure architecture and services", weight: "35–40%" },
        { n: 3, num: "§3", name: "Describe Azure management and governance", weight: "30–35%" }
      ],
      exam: { minutes: 45, total: 50, pass: 70, weight: 3 },
      practice: { min: 10, max: 90, def: 50 },
      pbqBlurb: "Every HOTSPOT and DRAG DROP item from the pool, rebuilt as interactive tasks — Yes/No, dropdown completion, and drag &amp; drop, with partial credit.",
      pbqCats: [
        ["all", "Mixed", "All PBQ styles"],
        ["yesno", "Yes / No", "Judge each statement"],
        ["dropdown", "Dropdown", "Complete the sentence"],
        ["dragdrop", "Drag &amp; drop", "Place the right options"]
      ],
      loadPool: function () {
        return fetch("data/questions.json").then(function (r) { return r.json(); })
          .then(function (list) {
            return list.map(function (q) { q.domain = +q.domain || 1; return q; });
          });
      },
      loadPbqs: function () { return (window.PBQ_TEST || []).slice(); }
    });
  </script>
</body>
</html>
